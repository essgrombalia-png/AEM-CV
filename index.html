<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:5.5rem}
@media(prefers-reduced-motion:no-preference){html{scroll-behavior:smooth}}
body{margin:0;background:#0b0b0b;font-family:Inter,Arial,sans-serif;overflow-x:hidden}
button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer}
:focus-visible{outline:2px solid #e5252a;outline-offset:3px}
img{display:block;max-width:100%}
/* ---------- Site ---------- */
.site{container:site/inline-size;background:var(--bg);color:var(--text);font:var(--fs)/var(--lh) var(--fb);letter-spacing:var(--ls);overflow-x:clip;min-height:100%}
.site a{color:inherit;text-decoration:none}
.site h1,.site h2,.site h3{font-family:var(--fh);font-weight:400;text-transform:uppercase;line-height:.92;margin:0}
.site h1{font-size:clamp(3.4rem,15cqi,calc(var(--h1)*1rem))}
.site h2{font-size:clamp(2.4rem,9cqi,calc(var(--h2)*1rem))}
.ac{color:var(--accent);font-style:normal}
.wrap{max-width:calc(var(--maxw)*1px);margin-inline:auto;padding-inline:clamp(1.25rem,5cqi,3rem)}
.sec{padding-block:clamp(3rem,10cqi,calc(var(--space)*1rem))}
.nav{position:relative;z-index:30;background:color-mix(in srgb,var(--bg) 94%,transparent);border-bottom:1px solid var(--line)}
.nav.st{position:sticky;top:0}
.nb{position:relative;z-index:6;display:flex;align-items:center;justify-content:space-between;gap:1.5rem;min-height:4.5rem;padding-block:.45rem}
.logo{display:flex;align-items:center;gap:.6rem;font:400 1.35rem var(--fh);text-transform:uppercase;letter-spacing:.04em}
.logo b{width:.6rem;height:.6rem;border-radius:50%;background:var(--accent)}
.nl{display:flex;gap:2rem}.nr{display:flex;align-items:center;gap:.8rem}
.nl a,.ul{font-size:.78rem;letter-spacing:.14em;text-transform:uppercase;background:linear-gradient(currentColor,currentColor) 0 100%/0 1px no-repeat;transition:background-size .3s;padding-bottom:3px}
.nl a:hover,.ul:hover{background-size:100% 1px}
.tg,.bg,.ar button{background:none;border:1px solid var(--line);width:2.5rem;height:2.5rem;border-radius:50%;color:var(--text);transition:border-color .2s,color .2s}
.tg:hover,.ar button:hover{border-color:var(--accent);color:var(--accent)}
.bg{display:none;place-items:center;border-radius:calc(var(--radius)*1px)}
.mm{position:absolute;left:0;right:0;top:0;height:100svh;z-index:5;background:var(--bg);padding:6rem clamp(1.25rem,5cqi,3rem) 2rem;display:flex;flex-direction:column;justify-content:space-between;animation:fd calc(.3s*var(--sp))}
.mm[hidden]{display:none}
.mm .big{display:block;font:400 clamp(2.6rem,14cqi,5rem)/1.1 var(--fh);text-transform:uppercase;border-bottom:1px solid var(--line)}
.btn{display:inline-flex;gap:.9rem;align-items:center;padding:1rem 1.6rem;background:var(--accent);color:#fff!important;border:0;border-radius:calc(var(--radius)*1px);font-weight:600;font-size:.78rem;letter-spacing:.14em;text-transform:uppercase;transition:filter .2s}

about:{vl:'Min filosofi',title:'God design\när tydligt tänkande\nsom *syns.*',text:'Jag tror att design är mer än estetik — det är ett verktyg för kommunikation, relation och tydlighet.',img:ph('#2c2c2c','#bdbdb8',1),cta:'Arbeta med mig',ctaH:'#contact',fx:Object.assign(FX(),{size:100,fade:100,fpy:50,con:100})},
login:{show:true,fTagline:'Bygg ett CV som får dig kallad till intervju.',fEmail:'',fPhone:'',fHours:'Vardagar 09–17',fCopy:'© {år} AEM CV. Alla rättigheter förbehållna.',pages:[{"l": "Om oss", "t": "Om *AEM CV*", "b": "AEM CV hjälper dig att göra en stark ansökan – från första utkast till färdigt CV.\n\nVi tror att ett tydligt, professionellt CV är det snabbaste sättet att bli sedd av rekryterare. Därför får du färdiga stilar, ett enkelt sätt att redigera dina uppgifter och verktyg för att dela resultatet.\n\nDet här kan du göra:\n- Bygga ett rent, professionellt CV som rekryterare snabbt kan skanna\n- Skriva ett personligt brev som matchar ditt CV\n- Få tydlig, konkret feedback för att förbättra ditt CV\n- Skapa en professionell porträttbild för din ansökan", "faq": false, "contact": false}, {"l": "Funktioner", "t": "Allt du får i *AEM CV*", "b": "- Färdiga CV-stilar: klassisk, modern, kreativ, minimal, executive och teknik\n- Redigera text, erfarenhet (jobbtitel, period och beskrivning), språk med nivå 0–100 och personuppgifter\n- Profilbild med full kontroll: storlek, zoom, position, form, effekter, ram och cirkel\n- Dela ditt CV som länk, PDF eller skrivskyddad HTML-fil – mottagaren behöver inte logga in och kan inte ändra något\n- Ljust och mörkt läge\n- Fungerar på mobil, surfplatta och dator\n- Personnumret döljs delvis som standard\n- Din data sparas i din egen webbläsare", "faq": false, "contact": false}, {"l": "Support", "t": "Support och vanliga frågor", "b": "Hittar du inte svaret här? Gå till Kontakta oss så hjälper vi dig.", "faq": true, "contact": false}, {"l": "Kontakta oss", "t": "Kontakta *oss*", "b": "Har du frågor, förslag eller behöver hjälp? Hör av dig så svarar vi så snart vi kan.", "faq": false, "contact": true}, {"l": "Integritet", "t": "Integritet och data", "b": "Dina uppgifter sparas lokalt i din webbläsare på den här enheten. Inget skickas till någon server av sajten själv.\n\nNär du delar ditt CV som länk, PDF eller HTML-fil följer personuppgifterna med så som de visas på sajten. Personnumret är delvis maskerat som standard.\n\nDu kan när som helst ändra eller ta bort din information under Redigera CV.", "faq": false, "contact": false}],faq:[{"q": "Hur skapar jag ett konto?", "a": "Välj Registrera dig på inloggningssidan, fyll i namn, e-post och ett lösenord på minst 8 tecken."}, {"q": "Jag har glömt mitt lösenord", "a": "Klicka på Glömt lösenord under inloggningsfältet och följ instruktionerna i fönstret."}, {"q": "Vad kan jag ändra som användare?", "a": "Du kan ändra all text i ditt CV och din profilbild. Sajtens design och övriga inställningar styrs av administratören."}, {"q": "Hur delar jag mitt CV?", "a": "Tryck på Dela i sidhuvudet. Du kan kopiera en länk, ladda ner en PDF eller en skrivskyddad HTML-fil. Den som får den behöver inte logga in."}, {"q": "Var sparas mina uppgifter?", "a": "I din webbläsare på den här enheten. Byter du webbläsare eller enhet behöver du dela eller exportera ditt CV."}, {"q": "Syns mitt personnummer för alla?", "a": "Personnumret är delvis maskerat som standard. Lämna fältet tomt om du vill dölja raden helt."}],exEyebrow:'Exempel',exTitle:'Så kan ditt *CV* se ut',exIntro:'Välj en stil och gör den till din egen.',examples:[{t:'Klassisk',d:'Tydligt och tidlöst – passar de flesta branscher.'},{t:'Modern',d:'Sidokolumn med porträtt, kontakt och färdigheter.'},{t:'Kreativ',d:'Färgstark rubrik och tidslinje för kreativa yrken.'},{t:'Minimal',d:'Luftigt och lättläst med fokus på innehållet.'},{t:'Executive',d:'Stilrent och tryggt för ledande roller.'},{t:'Teknik',d:'Kompetenser och projekt i fokus för IT och teknik.'}],eyebrow:'AEM CV',title:'Allt du behöver för en *stark ansökan*',intro:'Från första utkast till färdig ansökan – på ett ställe.',items:[{t:'Bygg ett rent, professionellt CV som rekryterare snabbt kan skanna'},{t:'Skriv ett personligt brev som matchar ditt CV'},{t:'Få tydlig, konkret feedback för att förbättra ditt CV'},{t:'Skapa en professionell porträttbild för din ansökan'}]},
